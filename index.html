<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <title>IPT2</title>
</head>

<body>
    <h1>REST Example (Users)</h1>
    <form id="dataForm">
        <label for="idInput">Enter ID:</label>
        <input type="text" id="idInput" placeholder="Enter ID">
        <button type="submit">Fetch Data</Data></button>
        <br>
        <br>
        <textarea id="printOutput" readonly style="width: 500px; height: 300px;" placeholder="Output will appea here"></textarea>
    </form>
</body>
<script>
    async function fetchData(id)  {
        try {
        const response = await fetch(`https://jsonplaceholder.typicode.com/comments/${id}`);
        const data = await response.json();
        console.log(data);
        document.getElementById("printOutput").value = JSON.stringify(data, null, 2);
        } catch (error) {
            console.error('Error fetching data:' , error);

        }
    }
    document.getElementById('dataForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const id = document.getElementById('idInput').value;
        fetchData(id);
    }
    )
    
</script>
</html>
